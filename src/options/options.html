<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SnapTranslate Settings</title>
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <h1>Settings</h1>
        <label>
            DeepL API Key:
            <input
                type="password"
                id="apiKey"
                placeholder="Enter your DeepL API key"
            />
        </label>
        <label>
            DeepL Plan:
            <select id="deeplPlan">
                <option value="free">Free</option>
                <option value="pro">Pro</option>
            </select>
        </label>
        <label>
            Translate To:
            <select id="targetLang">
                <option value="EN-US">English (US)</option>
                <option value="EN-GB">English (UK)</option>
                <option value="ES">Spanish</option>
                <option value="FR">French</option>
                <option value="DE">German</option>
                <option value="IT">Italian</option>
                <option value="PT-PT">Portuguese</option>
                <option value="NL">Dutch</option>
                <option value="JA">Japanese</option>
                <option value="KO">Korean</option>
                <option value="ZH">Chinese (simplified)</option>
            </select>
        </label>
        <fieldset id="ocrLanguages">
            <legend>Text recognition (OCR) languages</legend>
            <p class="hint">
                Only check languages you expect to select text in. Each
                additional language slows down every scan and increases the
                amount of data loaded.
            </p>
            <label
                ><input type="checkbox" value="eng" checked disabled /> English
                (always on)</label
            >
            <label><input type="checkbox" value="spa" /> Spanish</label>
            <label><input type="checkbox" value="fra" /> French</label>
            <label><input type="checkbox" value="deu" /> German</label>
            <label><input type="checkbox" value="ita" /> Italian</label>
            <label><input type="checkbox" value="por" /> Portuguese</label>
            <label><input type="checkbox" value="nld" /> Dutch</label>
            <label><input type="checkbox" value="jpn" /> Japanese</label>
            <label><input type="checkbox" value="kor" /> Korean</label>
            <label
                ><input type="checkbox" value="chi_sim" /> Chinese
                (simplified)</label
            >
            <label
                ><input type="checkbox" value="chi_tra" /> Chinese
                (traditional)</label
            >
        </fieldset>
        <button id="save">Save</button>
        <p id="status"></p>

        <script src="options.js"></script>
    </body>
</html>
